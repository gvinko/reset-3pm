(function () {

    return "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>" +

  var toDataUri = function (svg) {

  // Simpler: build without double-encoding issue.
  var buildIcon = function () {

      "<rect width='100' height='100' rx='18' fill='#1C1B1A'/>" +
      "<circle cx='50' cy='50' r='34' fill='none' stroke='#E8A33D' stroke-width='7'/>" +
      "<path d='M50 30 L50 52 L66 62' fill='none' stroke='#E8A33D' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/>" +
      "</svg>";
    return "data:image/svg+xml;base64," + btoa(svg);
  };
  var icon = buildIcon();
  var manifest = {

      { src: icon, sizes: "192x192", type: "image/svg+xml", purpose: "maskable" }
    ]
  };
  var link = document.createElement("link");
  link.rel = "manifest";
  link.href = "data:application/manifest+json;base64," + btoa(JSON.stringify(manifest));
  document.head.appendChild(link);

  var appleTouch = document.createElement("link");
  appleTouch.rel = "apple-touch-icon";
  appleTouch.href = icon;
  document.head.appendChild(appleTouch);

  var favicon = document.createElement("link");
  favicon.rel = "icon";
  favicon.href = icon;
  document.head.appendChild(favicon);

  window.__RESET_ICON__ = icon;

<script>
"use strict";

/* =========================================================================
   STORAGE
   ========================================================================= */
const STORAGE_KEY = "reset3pm_v1";

function todayKey(d) {
  d = d || new Date();
  return d.toLocaleDateString("en-CA"); // YYYY-MM-DD in local time
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function nextTopOrder() {
  if (STATE.tasks.length === 0) return 0;
  return Math.min.apply(null, STATE.tasks.map(t => t.order || 0)) - 10;
}

function migrateTaskOrder(tasks) {
  const missing = tasks.filter(t => t.order === undefined || t.order === null);
  if (missing.length === 0) return;
  const sorted = [...missing].sort((a, b) => b.priority - a.priority);
  sorted.forEach((t, i) => { t.order = i * 10; });
}

function escapeHtml(str) {
  if (str === undefined || str === null) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function defaultState() {
  return {
    tasks: [],
    brainDump: [],
    settings: {
      onboarded: false,
      phone: "",
      webhookUrl: "",
      notifEnabled: false,
      soundEnabled: true,
      lastReviewDate: null,
      lastChimeDate: null
    }
  };
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultState();
    const parsed = JSON.parse(raw);
    const base = defaultState();
    const tasks = Array.isArray(parsed.tasks) ? parsed.tasks : [];
    migrateTaskOrder(tasks);
    return {
      tasks,
      brainDump: Array.isArray(parsed.brainDump) ? parsed.brainDump : [],
      settings: Object.assign({}, base.settings, parsed.settings || {})
    };
  } catch (e) {
    console.error("RESET: failed to load state, starting fresh.", e);
    return defaultState();
  }
}

let STATE = loadState();
let syncTimer = null;
let syncReady = false;
let syncBusy = false;

function normalizeState(parsed) {
  const base = defaultState();
  const tasks = Array.isArray(parsed && parsed.tasks) ? parsed.tasks : [];
  migrateTaskOrder(tasks);
  return {
    tasks,
    brainDump: Array.isArray(parsed && parsed.brainDump) ? parsed.brainDump : [],
    settings: Object.assign({}, base.settings, (parsed && parsed.settings) || {})
  };
}

async function pushCloudState() {
  if (!syncReady || syncBusy || !navigator.onLine) return;
  syncBusy = true;
  try {
    const res = await fetch("/api/state", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(STATE)
    });
    if (!res.ok) throw new Error("sync " + res.status);
  } catch (e) {
    console.warn("RESET cloud sync delayed.", e);
  } finally {
    syncBusy = false;
  }
}

function queueCloudSave() {
  if (!syncReady) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(pushCloudState, 350);
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE));
    queueCloudSave();
  } catch (e) {
    console.error("RESET: failed to save state.", e);
    toast("Couldn't save — storage may be full.", "error");
  }
}

function itemTimestamp(item) {
  const candidates = [item && item.updatedAt, item && item.completedAt, item && item.createdAt].filter(Boolean);
  let best = 0;
  candidates.forEach(value => {
    const time = Date.parse(value);
    if (Number.isFinite(time) && time > best) best = time;
  });
  return best;
}

function mergeItems(localItems, cloudItems) {
  const merged = new Map();
  (cloudItems || []).forEach(item => {
    if (item && item.id) merged.set(item.id, item);
  });
  (localItems || []).forEach(item => {
    if (!item || !item.id) return;
    const existing = merged.get(item.id);
    if (!existing || itemTimestamp(item) > itemTimestamp(existing)) merged.set(item.id, item);
  });
  return Array.from(merged.values());
}

function mergeStates(local, cloud) {
  const base = defaultState();
  const localState = normalizeState(local || base);
  const cloudState = normalizeState(cloud || base);
  return {
    tasks: mergeItems(localState.tasks, cloudState.tasks),
    brainDump: mergeItems(localState.brainDump, cloudState.brainDump),
    settings: Object.assign({}, base.settings, cloudState.settings || {}, localState.settings || {})
  };
}

async function initialiseCloudSync() {
  try {
    const localRaw = localStorage.getItem(STORAGE_KEY);
    const local = localRaw ? normalizeState(JSON.parse(localRaw)) : defaultState();
    const res = await fetch("/api/state", { cache: "no-store" });
    if (!res.ok) throw new Error("sync " + res.status);
    const payload = await res.json();

    if (payload && payload.state) {
      // Never replace a device's local list wholesale. Merge both copies first,
      // save the merged copy locally, then publish it back to cloud.
      STATE = mergeStates(local, payload.state);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE));
      render();
      syncReady = true;
      await pushCloudState();
      return;
    } else if (localRaw) {
      STATE = local;
      syncReady = true;
      await pushCloudState();
      return;
    }
    syncReady = true;
  } catch (e) {
    console.warn("RESET is using local storage until cloud sync is available.", e);
    syncReady = true;
  }
}

async function refreshCloudState() {
  if (!syncReady || syncBusy || !navigator.onLine) return;
  try {
    const res = await fetch("/api/state", { cache: "no-store" });
    if (!res.ok) return;
    const payload = await res.json();
    if (!payload || !payload.state) return;
    const incoming = normalizeState(payload.state);
    if (JSON.stringify(incoming) !== JSON.stringify(STATE)) {
      STATE = incoming;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE));
      render();
    }
  } catch (e) { /* local fallback stays active */ }
}

window.addEventListener("online", () => { pushCloudState(); });
window.addEventListener("focus", refreshCloudState);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refreshCloudState(); });

/* =========================================================================
   TOASTS
   ========================================================================= */
function toast(message, kind) {
  const host = document.getElementById("toast-host");
  if (!host) return;
  const el = document.createElement("div");
  const color = kind === "error" ? "var(--urgent)" : kind === "success" ? "var(--done)" : "var(--surface-3)";
  el.className = "modal-enter px-4 py-3 rounded-lg text-sm font-medium shadow-lg border";
  el.style.background = "var(--surface-2)";
  el.style.borderColor = color;
  el.style.color = "var(--text)";
  el.textContent = message;
  host.appendChild(el);
  setTimeout(() => {
    el.style.transition = "opacity .3s ease";
    el.style.opacity = "0";
    setTimeout(() => el.remove(), 300);
  }, 2600);
}

/* =========================================================================
   PRIORITY HELPERS
   ========================================================================= */
function priorityBand(p) {
  if (p >= 5) return { label: "Urgent", color: "var(--urgent)", soft: "var(--urgent-soft)" };
  if (p === 4) return { label: "High", color: "var(--high)", soft: "var(--high-soft)" };
  return { label: "Routine", color: "var(--routine)", soft: "var(--routine-soft)" };
}

/* =========================================================================
   TASK CRUD
   ========================================================================= */
function createTask(data) {
  const task = {
    id: uid(),
    kind: data.kind || "task",
    title: (data.title || "").trim(),
    notes: (data.notes || "").trim(),
    contact: (data.contact || "").trim(),
    phone: (data.phone || "").trim(),
    address: (data.address || "").trim(),
    priority: data.priority ? Number(data.priority) : 3,
    order: nextTopOrder(),
    status: "active",
    waitingNote: "",
    createdAt: new Date().toISOString(),
    dateKey: todayKey(),
    completedAt: null,
    updatedAt: new Date().toISOString(),
    carriedOver: false
  };
  STATE.tasks.unshift(task);
  saveState();
  return task;
}

function updateTask(id, patch) {
  const t = STATE.tasks.find(t => t.id === id);
  if (!t) return;
  Object.assign(t, patch);
  t.updatedAt = new Date().toISOString();
  saveState();
}

function deleteTask(id) {
  STATE.tasks = STATE.tasks.filter(t => t.id !== id);
  saveState();
}

function toggleDone(id) {
  const t = STATE.tasks.find(t => t.id === id);
  if (!t) return;
  if (t.status === "done") {
    updateTask(id, { status: "active", completedAt: null });
  } else {
    updateTask(id, { status: "done", completedAt: new Date().toISOString() });
    toast("Marked done.", "success");
  }
  render();
}

function toggleWaiting(id, note) {
  const t = STATE.tasks.find(t => t.id === id);
  if (!t) return;
  if (t.status === "waiting") {
    updateTask(id, { status: "active", waitingNote: "" });
  } else {
    updateTask(id, { status: "waiting", waitingNote: note || t.waitingNote || "Waiting on response" });
  }
  render();
}

/* =========================================================================
   BRAIN DUMP
   ========================================================================= */
function addBrainDump(text) {
  text = (text || "").trim();
  if (!text) return;
  STATE.brainDump.unshift({ id: uid(), text, createdAt: new Date().toISOString(), processed: false });
  saveState();
  toast("Captured. It'll surface at your 3:00 review.", "success");
}

function unprocessedBrainDump() {
  return STATE.brainDump.filter(b => !b.processed);
}

/* =========================================================================
   ICS + OUTLOOK
   ========================================================================= */
function toICSDate(dt) {
  return dt.toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
}

function buildICS(task, start, end) {
  const now = toICSDate(new Date());
  const lines = [
    "BEGIN:VCALENDAR",
    "VERSION:2.0",
    "PRODID:-//RESET 3PM Review//EN",
    "CALSCALE:GREGORIAN",
    "METHOD:PUBLISH",
    "BEGIN:VEVENT",
    "UID:" + uid() + "@reset3pm",
    "DTSTAMP:" + now,
    "DTSTART:" + toICSDate(start),
    "DTEND:" + toICSDate(end),
    "SUMMARY:" + icsEscape(task.title),
    "LOCATION:" + icsEscape(task.address || ""),
    "DESCRIPTION:" + icsEscape(buildEventBody(task)),
    "END:VEVENT",
    "END:VCALENDAR"
  ];
  return lines.join("\r\n");
}

function icsEscape(str) {
  return String(str || "").replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n");
}

function buildEventBody(task) {
  const parts = [];
  if (task.contact) parts.push("Contact: " + task.contact);
  if (task.phone) parts.push("Phone: " + task.phone);
  if (task.notes) parts.push("Notes: " + task.notes);
  return parts.join("\n");
}

function downloadICS(task, start, end) {
  const ics = buildICS(task, start, end);
  const blob = new Blob([ics], { type: "text/calendar;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = (task.title || "appointment").replace(/[^a-z0-9\-_]+/gi, "_") + ".ics";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function outlookWebUrl(host, task, start, end) {
  const params = new URLSearchParams({
    path: "/calendar/action/compose",
    rru: "addevent",
    subject: task.title || "",
    location: task.address || "",
    body: buildEventBody(task),
    startdt: start.toISOString(),
    enddt: end.toISOString()
  });
  return "https://" + host + "/calendar/0/deeplink/compose?" + params.toString();
}

/* =========================================================================
   SPEECH RECOGNITION
   ========================================================================= */
let recognition = null;
let recognizing = false;

function initSpeech() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;
  const r = new SR();
  r.continuous = false;
  r.interimResults = true;
  r.lang = "en-AU";
  return r;
}

function toggleMic(inputEl, btnEl) {
  if (!recognition) recognition = initSpeech();
  if (!recognition) {
    toast("Voice capture isn't supported in this browser — type instead.", "error");
    return;
  }
  if (recognizing) {
    recognition.stop();
    return;
  }
  let finalText = "";
  recognition.onstart = () => {
    recognizing = true;
    btnEl.classList.add("pulse-rec");
    btnEl.style.background = "var(--urgent)";
  };
  recognition.onresult = (e) => {
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) finalText += e.results[i][0].transcript;
      else interim += e.results[i][0].transcript;
    }
    inputEl.value = (finalText + " " + interim).trim();
  };
  recognition.onerror = () => {
    toast("Didn't catch that — try typing.", "error");
  };
  recognition.onend = () => {
    recognizing = false;
    btnEl.classList.remove("pulse-rec");
    btnEl.style.background = "";
  };
  try { recognition.start(); } catch (e) { /* already started, ignore */ }
}

/* =========================================================================
   3:00 PM CHIME + NOTIFICATIONS
   ========================================================================= */
function playChime() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const notes = [880, 1108, 1318];
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, ctx.currentTime + i * 0.18);
      gain.gain.exponentialRampToValueAtTime(0.22, ctx.currentTime + i * 0.18 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + i * 0.18 + 0.5);
      osc.connect(gain).connect(ctx.destination);
      osc.start(ctx.currentTime + i * 0.18);
      osc.stop(ctx.currentTime + i * 0.18 + 0.55);
    });
  } catch (e) { console.error("Chime failed", e); }
}

function fireThreeOClockAlert(isTest) {
  if (STATE.settings.soundEnabled) playChime();
  if (STATE.settings.notifEnabled && "Notification" in window && Notification.permission === "granted") {
    try {
      new Notification("3:00 PM Review", {
        body: "Time to sort today's work — " + (unprocessedBrainDump().length) + " new item(s) waiting.",
        icon: window.__RESET_ICON__
      });
    } catch (e) { /* ignore */ }
  }
  if (STATE.settings.webhookUrl) {
    fetch(STATE.settings.webhookUrl, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ event: "3pm_review", time: new Date().toISOString(), test: !!isTest })
    }).catch(() => { /* best-effort, ignore network/CORS errors */ });
  }
  if (!isTest) STATE.settings.lastChimeDate = todayKey();
  saveState();
}

function startChimeWatcher() {
  setInterval(() => {
    const now = new Date();
    if (now.getHours() === 15 && now.getMinutes() === 0 && STATE.settings.lastChimeDate !== todayKey()) {
      fireThreeOClockAlert(false);
      renderHeaderBadges();
    }
  }, 20000);
}

/* =========================================================================
   PDF EXPORT
   ========================================================================= */
function exportPDF() {
  const { jsPDF } = window.jspdf || {};
  if (!jsPDF) { toast("PDF library failed to load — check your connection.", "error"); return; }
  const doc = new jsPDF({ unit: "pt", format: "a4" });
  const pageW = doc.internal.pageSize.getWidth();
  const marginX = 40;
  let y = 48;

  doc.setFont("helvetica", "bold");
  doc.setFontSize(18);
  doc.setTextColor(20, 20, 20);
  doc.text("3:00 PM Field Review", marginX, y);
  doc.setFont("helvetica", "normal");
  doc.setFontSize(11);
  doc.setTextColor(90, 90, 90);
  const dateStr = new Date().toLocaleDateString("en-AU", { weekday: "long", year: "numeric", month: "long", day: "numeric" });
  doc.text(dateStr, pageW - marginX, y, { align: "right" });
  y += 14;
  doc.setDrawColor(210, 210, 210);
  doc.line(marginX, y, pageW - marginX, y);
  y += 20;

  const active = STATE.tasks.filter(t => t.status !== "done").sort((a, b) => b.priority - a.priority);

  if (active.length === 0) {
    doc.setFontSize(12);
    doc.setTextColor(120, 120, 120);
    doc.text("Nothing outstanding — clean slate.", marginX, y);
  } else {
    const availableH = doc.internal.pageSize.getHeight() - y - 130; // reserve space for notes area
    const rowH = Math.max(34, Math.min(58, availableH / active.length));
    const bandColor = (p) => p >= 5 ? [196, 67, 43] : p === 4 ? [217, 143, 43] : [140, 140, 140];
    const bandLabel = (p) => p >= 5 ? "URGENT" : p === 4 ? "HIGH" : "ROUTINE";

    active.forEach((t) => {
      // checkbox
      doc.setDrawColor(60, 60, 60);
      doc.rect(marginX, y - 11, 12, 12);
      // priority chip
      const c = bandColor(t.priority);
      doc.setFillColor(c[0], c[1], c[2]);
      doc.roundedRect(marginX + 20, y - 12, 62, 15, 3, 3, "F");
      doc.setFontSize(8);
      doc.setTextColor(255, 255, 255);
      doc.text(bandLabel(t.priority), marginX + 51, y - 1.5, { align: "center" });
      // title
      doc.setFontSize(12);
      doc.setFont("helvetica", "bold");
      doc.setTextColor(20, 20, 20);
      let title = t.title || "(untitled)";
      if (t.status === "waiting") title += "  [Waiting]";
      doc.text(title, marginX + 92, y, { maxWidth: pageW - marginX * 2 - 92 });
      // meta line
      doc.setFont("helvetica", "normal");
      doc.setFontSize(9.5);
      doc.setTextColor(100, 100, 100);
      const metaParts = [];
      if (t.contact) metaParts.push(t.contact);
      if (t.phone) metaParts.push(t.phone);
      if (t.address) metaParts.push(t.address);
      if (metaParts.length) doc.text(metaParts.join("   ·   "), marginX + 92, y + 13, { maxWidth: pageW - marginX * 2 - 92 });

      y += rowH;
      doc.setDrawColor(230, 230, 230);
      doc.line(marginX, y - rowH + 20, pageW - marginX, y - rowH + 20);
    });
  }

  // notes area
  const notesY = doc.internal.pageSize.getHeight() - 110;
  doc.setDrawColor(200, 200, 200);
  doc.line(marginX, notesY, pageW - marginX, notesY);
  doc.setFontSize(10);
  doc.setTextColor(120, 120, 120);
  doc.text("Site notes", marginX, notesY + 16);
  for (let i = 0; i < 3; i++) {
    const ly = notesY + 34 + i * 22;
    doc.setDrawColor(215, 215, 215);
    doc.line(marginX, ly, pageW - marginX, ly);
  }

  doc.save("3pm-review-" + todayKey() + ".pdf");
}

/* =========================================================================
   SERVICE WORKER (best-effort — inline via Blob URL; requires a Chromium
   browser and http(s) origin. App works fully without it.)
   ========================================================================= */
function registerServiceWorker() {
  if (!("serviceWorker" in navigator)) return;
  if (location.protocol === "file:") return; // SW cannot register from local files
  const swSource = [
    "const CACHE = 'reset3pm-v1';",
    "self.addEventListener('install', (e) => { self.skipWaiting(); });",
    "self.addEventListener('activate', (e) => { self.clients.claim(); });",
    "self.addEventListener('fetch', (e) => {",
    "  e.respondWith(",
    "    caches.open(CACHE).then((cache) =>",
    "      fetch(e.request).then((res) => { cache.put(e.request, res.clone()); return res; })",
    "        .catch(() => cache.match(e.request))",
    "    )",
    "  );",
    "});"
  ].join("\n");
  try {
    const blob = new Blob([swSource], { type: "application/javascript" });
    const swUrl = URL.createObjectURL(blob);
    navigator.serviceWorker.register(swUrl).catch(() => { /* not supported here — ignore */ });
  } catch (e) { /* ignore */ }
}

function deadlineInfo(t) {
  if (!t.dueAt || t.status === "done") return null;
  const due = new Date(t.dueAt); if (Number.isNaN(due.getTime())) return null;
  const diff = due - new Date(), day = 86400000;
  let label, level;
  if (diff < 0) { label="OVERDUE"; level="overdue"; }
  else if (diff <= day) { label="DUE TODAY"; level="today"; }
  else if (diff <= 3*day) { label="DUE " + due.toLocaleDateString("en-AU",{weekday:"short"}).toUpperCase(); level="soon"; }
  else { label="Due " + due.toLocaleDateString("en-AU",{weekday:"short",day:"numeric",month:"short"}); level="normal"; }
  return {label,level,title:due.toLocaleString("en-AU",{weekday:"long",day:"numeric",month:"short",hour:"numeric",minute:"2-digit"})};
}

        b.classList.toggle("border-[var(--accent)]", on);
        b.classList.toggle("text-[var(--accent)]", on);
        b.classList.toggle("border-[var(--border)]", !on);
        b.classList.toggle("text-[var(--text-muted)]", !on);
      });
    });
  });

  const priorityInput = document.getElementById("tm-priority");
  const priorityLabel = document.getElementById("tm-priority-label");
  priorityInput.addEventListener("input", () => {
    const b = priorityBand(Number(priorityInput.value));
    priorityLabel.textContent = b.label;
    priorityLabel.style.color = b.color;
  });

  document.getElementById("tm-cancel").addEventListener("click", closeModal);
  const delBtn = document.getElementById("tm-delete");
  if (delBtn) delBtn.addEventListener("click", () => {
    deleteTask(t.id);
    closeModal();
    render();
    toast("Deleted.", "success");
  });

  document.getElementById("tm-save").addEventListener("click", () => {
    const title = document.getElementById("tm-title").value.trim();
    if (!title) { toast("Give it a short title first.", "error"); return; }
    const payload = {
      kind: selectedKind,
      title,
      notes: document.getElementById("tm-notes").value,
      contact: document.getElementById("tm-contact").value,
      phone: document.getElementById("tm-phone").value,
      address: document.getElementById("tm-address").value,
      priority: Number(priorityInput.value)
    };
    if (t) updateTask(t.id, payload);
    else createTask(payload);
    closeModal();
    render();
    toast(t ? "Updated." : "Added.", "success");
  });
}

/* ---------- Book in Outlook Modal ---------- */
function openBookModal(id) {

  const now = new Date();
  now.setMinutes(0, 0, 0);
  now.setHours(now.getHours() + 1);
  const dateVal = todayKey(now);

  openModal(`

    <p class="text-sm text-[var(--text-muted)] mb-4">${escapeHtml(t.title)}</p>

      </div>
      <div>
        <label class="block text-xs font-medium text-[var(--text-muted)] mb-1">Start time</label>
        <input id="bm-time" type="time" value="${timeVal}" class="w-full bg-[var(--surface-2)] rounded-lg px-3 py-2.5 outline-none text-sm border border-[var(--border)] focus:border-[var(--accent)]" />
      </div>
    </div>
    <div class="mb-4">
      <label class="block text-xs font-medium text-[var(--text-muted)] mb-1">Duration</label>
      <select id="bm-duration" class="w-full bg-[var(--surface-2)] rounded-lg px-3 py-2.5 outline-none text-sm border border-[var(--border)] focus:border-[var(--accent)]">
        <option value="30">30 minutes</option>
        <option value="60" selected>1 hour</option>
        <option value="90">1.5 hours</option>
        <option value="120">2 hours</option>
      </select>
    </div>
    <div class="space-y-2">
      <button id="bm-web" class="w-full flex items-center justify-center gap-2 py-3 rounded-xl bg-[var(--accent)] text-[var(--accent-ink)] font-bold text-sm active:scale-[0.98] transition-transform">
        <i data-lucide="external-link" class="w-4 h-4"></i> Open in Outlook Web
      </button>

      <button id="bm-ics" class="w-full flex items-center justify-center gap-2 py-3 rounded-xl bg-[var(--surface-2)] font-bold text-sm active:scale-[0.98] transition-transform">
        <i data-lucide="download" class="w-4 h-4"></i> Download for Outlook Mobile (.ics)
      </button>
    </div>
    <button id="bm-cancel" class="w-full py-3 mt-3 rounded-xl text-sm font-semibold text-[var(--text-muted)]">Cancel</button>
  `);

  function getRange() {
    const d = document.getElementById("bm-date").value;
    const tm = document.getElementById("bm-time").value;
    const dur = Number(document.getElementById("bm-duration").value);
    const start = new Date(d + "T" + tm + ":00");
    const end = new Date(start.getTime() + dur * 60000);
    return { start, end };
  }

  document.getElementById("bm-web").addEventListener("click", () => {
    const { start, end } = getRange();
    window.open(outlookWebUrl("outlook.office.com", t, start, end), "_blank");
  });
  document.getElementById("bm-web-alt").addEventListener("click", () => {
    const { start, end } = getRange();
    window.open(outlookWebUrl("outlook.live.com", t, start, end), "_blank");
  });
  document.getElementById("bm-ics").addEventListener("click", () => {
    const { start, end } = getRange();
    downloadICS(t, start, end);
    toast("Calendar file downloaded — open it to add to Outlook Mobile.", "success");
  });
  document.getElementById("bm-cancel").addEventListener("click", closeModal);
}

/* =========================================================================
   3:00 REVIEW WIZARD
   ========================================================================= */
function openReviewWizard() {
  reviewStep = 1;
  renderReviewStep();
}

function renderReviewStep() {
  const outstanding = STATE.tasks.filter(t => t.status !== "done").sort((a, b) => b.priority - a.priority);
  const dumpItems = unprocessedBrainDump();

  let body = "";
  if (reviewStep === 1) {
    body = `
      <p class="text-sm text-[var(--text-muted)] mb-4">Tick off what's done. Anything left unchecked carries straight into today — no extra step.</p>
      <div class="space-y-2 max-h-[50vh] overflow-y-auto no-scrollbar">
        ${outstanding.length === 0 ? `<p class="text-sm text-[var(--text-faint)] py-6 text-center">Nothing outstanding. Clean slate.</p>` :
          outstanding.map(t => `
          <label class="flex items-center gap-3 p-3 rounded-lg bg-[var(--surface-2)] cursor-pointer">
            <input type="checkbox" data-review-done="${t.id}" class="w-5 h-5 accent-[var(--accent)]" />
            <span class="flex-1 text-sm font-medium">${escapeHtml(t.title)}</span>
            <span class="text-[10px] font-bold uppercase px-1.5 py-0.5 rounded" style="background:${priorityBand(t.priority).soft};color:${priorityBand(t.priority).color}">${priorityBand(t.priority).label}</span>
          </label>`).join("")}
      </div>
    `;
  } else if (reviewStep === 2) {
    body = `
      <p class="text-sm text-[var(--text-muted)] mb-4">Sort what's in your brain dump, and add anything new that's come in.</p>
      <div class="space-y-2 max-h-[34vh] overflow-y-auto no-scrollbar mb-4">
        ${dumpItems.length === 0 ? `<p class="text-sm text-[var(--text-faint)] py-4 text-center">Brain dump is empty.</p>` :
          dumpItems.map(b => `
          <div class="p-3 rounded-lg bg-[var(--surface-2)]" data-dump-id="${b.id}">
            <p class="text-sm font-medium mb-2">${escapeHtml(b.text)}</p>
            <div class="flex gap-2">
              <button class="dump-to-task text-xs font-semibold px-2.5 py-1.5 rounded-lg bg-[var(--accent)] text-[var(--accent-ink)]">Add as task</button>
              <button class="dump-dismiss text-xs font-semibold px-2.5 py-1.5 rounded-lg bg-[var(--surface-3)] text-[var(--text-muted)]">Dismiss</button>
            </div>
          </div>`).join("")}
      </div>
      <label class="block text-xs font-medium text-[var(--text-muted)] mb-1">Add a new quote or task request</label>
      <div class="flex gap-2">
        <input id="rv-new-item" type="text" placeholder="e.g. Quote for ducted system, 12 Bell St" class="flex-1 bg-[var(--surface-2)] rounded-lg px-3.5 py-3 outline-none text-sm border border-[var(--border)] focus:border-[var(--accent)] placeholder:text-[var(--text-faint)]" />
        <button id="rv-new-item-add" class="px-4 rounded-lg bg-[var(--surface-2)] font-semibold text-sm">Add</button>
      </div>
    `;
  } else {
    const forSort = STATE.tasks.filter(t => t.status === "active").sort((a, b) => b.priority - a.priority);
    body = `
      <p class="text-sm text-[var(--text-muted)] mb-4">Drag each slider to set today's priority. The list re-sorts as you go.</p>
      <div class="space-y-4 max-h-[54vh] overflow-y-auto no-scrollbar pr-1" id="rv-priority-list">
        ${forSort.length === 0 ? `<p class="text-sm text-[var(--text-faint)] py-6 text-center">Nothing active to prioritise.</p>` :
          forSort.map(t => `
          <div class="p-3 rounded-lg bg-[var(--surface-2)]" data-priority-id="${t.id}">
            <div class="flex items-center justify-between mb-2">
              <span class="text-sm font-semibold">${escapeHtml(t.title)}</span>
              <span class="rv-band text-xs font-bold" style="color:${priorityBand(t.priority).color}">${priorityBand(t.priority).label}</span>
            </div>
            <input type="range" min="1" max="5" step="1" value="${t.priority}" class="w-full rv-slider" />
          </div>`).join("")}
      </div>
    `;
  }

  openModal(`
    <div class="flex items-center justify-between mb-1">
      <h2 class="text-lg font-bold">3:00 Review — Step ${reviewStep} of 3</h2>
      <button id="rv-close" class="w-8 h-8 rounded-full bg-[var(--surface-2)] flex items-center justify-center"><i data-lucide="x" class="w-4 h-4"></i></button>
    </div>
    <div class="flex gap-1.5 mb-4">
      ${[1,2,3].map(n => `<div class="flex-1 h-1.5 rounded-full" style="background:${n <= reviewStep ? "var(--accent)" : "var(--surface-3)"}"></div>`).join("")}
    </div>
    <div id="rv-body">${body}</div>
    <div class="flex gap-2.5 mt-5">
      ${reviewStep > 1 ? `<button id="rv-back" class="px-4 py-3 rounded-xl bg-[var(--surface-2)] font-semibold text-sm">Back</button>` : ""}
      <button id="rv-next" class="flex-1 py-3 rounded-xl bg-[var(--accent)] text-[var(--accent-ink)] font-bold text-sm">${reviewStep < 3 ? "Continue" : "Finish review"}</button>
    </div>
  `);

  bindReviewStep(outstanding);
}

function bindReviewStep() {
  document.getElementById("rv-close").addEventListener("click", closeModal);
  const backBtn = document.getElementById("rv-back");
  if (backBtn) backBtn.addEventListener("click", () => { reviewStep -= 1; renderReviewStep(); });

  if (reviewStep === 2) {
    document.querySelectorAll(".dump-to-task").forEach(btn => {
      btn.addEventListener("click", (e) => {
        const wrap = e.target.closest("[data-dump-id]");
        const dumpId = wrap.dataset.dumpId;
        const item = STATE.brainDump.find(b => b.id === dumpId);
        if (!item) return;
        createTask({ title: item.text, kind: "task", priority: 3 });
        item.processed = true;
        saveState();
        renderReviewStep();
      });
    });
    document.querySelectorAll(".dump-dismiss").forEach(btn => {
      btn.addEventListener("click", (e) => {
        const wrap = e.target.closest("[data-dump-id]");
        const item = STATE.brainDump.find(b => b.id === wrap.dataset.dumpId);
        if (!item) return;
        item.processed = true;
        saveState();
        renderReviewStep();
      });
    });
    const addBtn = document.getElementById("rv-new-item-add");
    if (addBtn) addBtn.addEventListener("click", () => {
      const input = document.getElementById("rv-new-item");
      const val = input.value.trim();
      if (!val) return;
      createTask({ title: val, kind: "quote", priority: 3 });
      input.value = "";
      renderReviewStep();
    });
  }

  if (reviewStep === 3) {
    document.querySelectorAll(".rv-slider").forEach(slider => {
      slider.addEventListener("input", (e) => {
        const wrap = e.target.closest("[data-priority-id]");
        const id = wrap.dataset.priorityId;
        const val = Number(e.target.value);
        updateTask(id, { priority: val });
        const band = priorityBand(val);
        const label = wrap.querySelector(".rv-band");
        label.textContent = band.label;
        label.style.color = band.color;
      });
    });
  }

  document.getElementById("rv-next").addEventListener("click", () => {
    if (reviewStep === 1) {
      document.querySelectorAll("[data-review-done]").forEach(cb => {
        if (cb.checked) updateTask(cb.dataset.reviewDone, { status: "done", completedAt: new Date().toISOString() });
      });
      // anything still active/waiting simply carries forward — stamp today's date
      STATE.tasks.forEach(t => {
        if (t.status !== "done" && t.dateKey < todayKey()) { t.dateKey = todayKey(); t.carriedOver = true; }
      });
      saveState();
      reviewStep = 2;
      renderReviewStep();
    } else if (reviewStep === 2) {
      reviewStep = 3;
      renderReviewStep();
    } else {
      STATE.settings.lastReviewDate = todayKey();
      saveState();
      closeModal();
      render();
      toast("Review complete. Today's list is sorted.", "success");
    }
  });
}

function enableCardDragReorder() {
  const container = document.getElementById("task-list");
  if (!container) return;
  let dragging = null;
  let pointerId = null;

  container.querySelectorAll(".drag-handle-btn").forEach(handle => {
    handle.addEventListener("pointerdown", (e) => {
      const card = handle.closest(".task-card");
      if (!card) return;
      dragging = card;
      pointerId = e.pointerId;
      handle.setPointerCapture(pointerId);
      card.classList.add("dragging");
      e.preventDefault();
    });

    handle.addEventListener("pointermove", (e) => {
      if (!dragging || e.pointerId !== pointerId) return;
      e.preventDefault();
      const siblings = Array.from(container.querySelectorAll(".task-card")).filter(c => c !== dragging);
      const y = e.clientY;
      let target = null;
      let before = true;
      for (const sib of siblings) {
        const rect = sib.getBoundingClientRect();
        const mid = rect.top + rect.height / 2;
        if (y < mid) { target = sib; before = true; break; }
        target = sib; before = false;
      }
      if (target) {
        if (before) container.insertBefore(dragging, target);
        else container.insertBefore(dragging, target.nextSibling);
      }
    });

    const endDrag = (e) => {
      if (!dragging || e.pointerId !== pointerId) return;
      dragging.classList.remove("dragging");
      try { handle.releasePointerCapture(pointerId); } catch (err) { /* already released */ }
      Array.from(container.querySelectorAll(".task-card")).forEach((c, i) => {
        const t = STATE.tasks.find(x => x.id === c.dataset.id);
        if (t) t.order = i * 10;
      });
      saveState();
      dragging = null;
      pointerId = null;
      render();
    };
    handle.addEventListener("pointerup", endDrag);
    handle.addEventListener("pointercancel", endDrag);
  });
}
